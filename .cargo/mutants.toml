# Mutate the reference plugin and the protocol library, then ask the conformance
# suite whether the result is still conformant. A surviving mutant is a hole in
# the suite, not in the plugin — this is the automated form of the five mutants
# that were written by hand.
#
# The harnesses themselves are excluded: mutating the thing that does the judging
# tells you nothing about the thing being judged.
exclude_globs = [
  "crates/cop-conformance/**",
  "crates/cop-spec-check/**",
  "crates/cop-mischief/**",
]
