# cargo-deny: advisories, licences, duplicate versions, and source provenance in
# one gate. This replaces cargo-audit rather than complementing it — both read the
# same RustSec database, and only this one also checks licences and sources.

[graph]
all-features = true

[advisories]
# Fail on any known vulnerability or unmaintained crate in the tree.
yanked = "deny"

[licenses]
# The workspace is MIT. Anything permissive is fine to depend on; anything
# copyleft or unclear is a decision, not a default.
version = 2
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  # Add entries here as the tree grows; an allowance nothing uses is an
  # unverified claim, so unused ones are removed rather than kept "just in case".
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
# A duplicated major version usually means two dependencies disagree, which is
# worth seeing even when it is harmless.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
