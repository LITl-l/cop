name: COP
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - run: sudo apt-get update && sudo apt-get install -y universal-ctags
      - run: bun install --cwd plugins/typescript --frozen-lockfile
      - run: make check

  # A surviving mutant is a hole in the conformance suite, not a broken build,
  # so this gates on the score rather than on the tool's exit status. The score
  # is currently 100%; a drop is a suite regression and should be argued about
  # in review, which is what failing here forces.
  mutants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y universal-ctags
      - run: cargo install cargo-mutants --locked
      - run: make mutants
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: mutants-report, path: mutants.out/ }

  # cop-core is what third-party plugins compile against. A breaking change is
  # allowed; a breaking change nobody noticed is not.
  semver:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-semver-checks --locked
      - run: make semver BASELINE=origin/${{ github.base_ref }}
